services:
  app:
    image: portfolio:local
    build:
      context: .
      args:
        BUILD_DATE: ${BUILD_DATE:-local}
    environment:
      FORMSPREE_ID: ${FORMSPREE_ID:-meelkpqg}
    ports:
      - "127.0.0.1:3001:3001"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    restart: unless-stopped
